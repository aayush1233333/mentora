services:
  - type: web
    name: mentora-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: WEB_CONCURRENCY
        value: 1
      - key: PYTHONPATH
        value: /app:/app/backend
      - key: CORS_ORIGINS
        value: https://mentora-repoo.vercel.app
      - key: GEMINI_API_KEY
        sync: false
